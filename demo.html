<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSight - Visualization Comparison</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Inter", system-ui, sans-serif; }
  .picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; background: #1a1a1a; padding: 0 12px; }
  .picker button { padding: 14px 18px; background: none; border: none; color: #999; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
  .picker button:hover { color: #fff; }
  .picker button.active { color: #fff; border-bottom-color: #e64d3d; }
  .test-panel { display: none; min-height: 100vh; }
  .test-panel.active { display: block; }
  h1, h2, h3 { margin: 0; }
  .label { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 18px; }

  /* ===== TEST 1: Progress Bar Leaderboard ===== */
  #test1 { background: #fff; color: #1a1a1a; padding: 36px 24px 80px; }
  .t1-wrap { max-width: 720px; margin: 0 auto; }
  #test1 .label { color: #7a1f2b; }
  .t1-summary { font-size: 14px; color: #555; margin-bottom: 26px; }
  .t1-summary b { color: #1a1a1a; }
  .t1-bar-row { display: grid; grid-template-columns: 160px 1fr 42px; align-items: center; gap: 10px; padding: 7px 0; }
  .t1-bar-row .name { font-size: 13px; }
  .t1-bar-track { background: #eee; border-radius: 4px; height: 10px; overflow: hidden; }
  .t1-bar-fill { height: 100%; border-radius: 4px; }
  .t1-bar-row .pct { font-size: 13px; text-align: right; font-weight: 600; }
  .t1-risk { margin-top: 30px; font-size: 14px; line-height: 2; }
  .t1-risk b { color: #7a1f2b; }

  /* ===== TEST 2: Dense Data Table ===== */
  #test2 { background: #fff; color: #1c1c1c; padding: 0; }
  .t2-topbar { background: #16181d; color: #fff; padding: 14px 24px; font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .t2-topbar b { color: #6ee7b7; }
  .t2-wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  table.t2 { width: 100%; border-collapse: collapse; font-family: "JetBrains Mono", monospace; font-size: 13px; }
  table.t2 th { text-align: left; font-size: 11px; text-transform: uppercase; color: #888; border-bottom: 2px solid #1c1c1c; padding: 8px 10px; }
  table.t2 th.num, table.t2 td.num { text-align: right; }
  table.t2 td { padding: 9px 10px; border-bottom: 1px solid #eee; }
  table.t2 tr:nth-child(even) { background: #fafafa; }
  .t2-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  /* ===== TEST 3: Treemap + Tag Cloud ===== */
  #test3 { background: #f4f2ee; color: #1a1a1a; padding: 36px 24px 80px; }
  .t3-wrap { max-width: 900px; margin: 0 auto; }
  #test3 .label { color: #7a1f2b; }
  .t3-treemap { display: flex; flex-wrap: wrap; height: 160px; gap: 3px; margin-bottom: 40px; }
  .t3-block { display: flex; align-items: flex-end; padding: 8px; color: #fff; font-size: 12px; min-width: 60px; border-radius: 3px; }
  .t3-cloud { text-align: center; line-height: 1.9; max-width: 620px; margin: 0 auto; }
  .t3-cloud span { display: inline-block; margin: 0 10px; color: #7a1f2b; font-weight: 700; }

  /* ===== TEST 4: Column Chart + Narrative ===== */
  #test4 { background: #fff; color: #1a1a1a; padding: 36px 24px 80px; }
  .t4-wrap { max-width: 760px; margin: 0 auto; }
  #test4 .label { color: #7a1f2b; }
  .t4-chart { display: flex; align-items: flex-end; gap: 14px; height: 220px; border-bottom: 2px solid #1a1a1a; margin-bottom: 8px; padding: 0 4px; }
  .t4-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .t4-col .bar { width: 100%; max-width: 46px; border-radius: 4px 4px 0 0; }
  .t4-col .val { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .t4-labels { display: flex; gap: 14px; padding: 0 4px; margin-bottom: 36px; }
  .t4-labels div { flex: 1; text-align: center; font-size: 10px; color: #777; }
  .t4-prose { font-size: 17px; line-height: 1.7; max-width: 620px; }
  .t4-prose b { color: #7a1f2b; }

  /* ===== TEST 5: Kanban Board ===== */
  #test5 { background: #f4f5f7; color: #1a1a1a; padding: 36px 24px 80px; }
  .t5-wrap { max-width: 900px; margin: 0 auto; }
  #test5 .label { color: #7a1f2b; }
  .t5-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .t5-col { background: #e9eaed; border-radius: 10px; padding: 12px; }
  .t5-col h3 { font-size: 13px; padding: 4px 4px 12px; display: flex; justify-content: space-between; }
  .t5-card { background: #fff; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); border-left: 4px solid transparent; }
  .t5-card b { display: block; font-size: 13px; }
  .t5-card span { font-size: 11px; color: #777; }
  @media (max-width: 700px) { .t5-board { grid-template-columns: 1fr; } }

  /* ===== TEST 6: Radial Gauges + Waffle Charts ===== */
  #test6 { background: #f8f7fb; color: #1f1b2e; padding: 36px 24px 80px; }
  .t6-wrap { max-width: 900px; margin: 0 auto; }
  #test6 .label { color: #7a1f2b; }
  .t6-gauges { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 40px; }
  .t6-gauge { text-align: center; width: 110px; }
  .t6-gauge svg { transform: rotate(-90deg); display: block; margin: 0 auto; }
  .t6-gauge b { display: block; margin-top: -68px; font-family: "Space Grotesk", sans-serif; font-size: 19px; position: relative; }
  .t6-gauge span { display: block; margin-top: 8px; font-size: 11px; color: #6b6b74; }
  .t6-waffle-row { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
  .t6-waffle-row .name { width: 160px; font-size: 12px; flex-shrink: 0; }
  .t6-waffle { display: grid; grid-template-columns: repeat(10, 10px); grid-template-rows: repeat(2, 10px); gap: 2px; }
  .t6-waffle div { border-radius: 2px; background: #e3e0ea; }
  .t6-waffle-row .pct { font-size: 12px; font-weight: 700; width: 36px; text-align: right; }

  /* ===== TEST 7: Bento Mosaic + Bubble Cluster ===== */
  #test7 { background: #ececec; padding: 24px 24px 80px; }
  .t7-grid { max-width: 900px; margin: 0 auto 30px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 100px; gap: 12px; }
  .t7-box { border-radius: 16px; padding: 16px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
  .t7-hero { grid-column: span 2; grid-row: span 2; background: linear-gradient(135deg,#1a1a1a,#3a3a3a); }
  .t7-hero b { font-family: "Space Grotesk", sans-serif; font-size: 52px; }
  .t7-mid { grid-column: span 2; background: #7a1f2b; }
  .t7-small { grid-column: span 1; }
  @media (max-width: 700px) { .t7-grid { grid-template-columns: repeat(2,1fr); } .t7-hero, .t7-mid { grid-column: span 2; } }
  .t7-bubbles { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .t7-bubble { border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; font-size: 11px; flex-shrink: 0; }
  .t7-bubble b { display: block; font-size: 14px; }
</style>
</head>
<body>

<nav class="picker" id="picker"></nav>
<div id="panels"></div>

<script>
  const STATS = [
    { v: 58, suf: "%", l: "Avg Coverage" }, { v: 5, suf: "", l: "Capability Gaps" },
    { v: 6, suf: "", l: "Succession Risks" }, { v: 5, suf: "", l: "Future Needs" }, { v: 19, suf: "", l: "Locations" }
  ];
  const TILES = [
    { s: "Line Operations", seg: "Manufacturing", p: 82 }, { s: "PLC / Automation", seg: "Manufacturing", p: 34 },
    { s: "Food Safety / HACCP", seg: "Manufacturing", p: 91 }, { s: "Refrigeration Systems", seg: "Manufacturing", p: 22 },
    { s: "Route Sales", seg: "Retail", p: 88 }, { s: "DSD Logistics", seg: "Retail", p: 65 },
    { s: "R&D / Food Science", seg: "Corporate", p: 18 }, { s: "Data Analytics", seg: "Corporate", p: 41 },
    { s: "Legal / Compliance", seg: "Corporate", p: 20 }
  ];
  const ROWS = [
    { s: "Ammonia Refrigeration Systems", m: "Manufacturing & Logistics", n: 2 },
    { s: "PLC / Automation Programming", m: "Manufacturing & Logistics", n: 3 },
    { s: "R&D / Food Science - Frozen Dough", m: "Corporate", n: 1 }
  ];
  const hue = p => Math.round((p / 100) * 120);
  const hsl = p => `hsl(${hue(p)},65%,45%)`;

  function ring(pct, size, stroke, color, track) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
    return `<svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>`;
  }

  function build(id) {
    const el = document.getElementById(id);

    if (id === "test1") {
      const sorted = [...TILES].sort((a,b) => b.p - a.p);
      el.innerHTML = `<div class="t1-wrap">
        <div class="label">Test 1 - Progress Bar Leaderboard</div>
        <div class="t1-summary">${STATS.map(s => `<b>${s.v}${s.suf}</b> ${s.l}`).join(" &nbsp;&middot;&nbsp; ")}</div>
        ${sorted.map(t => `<div class="t1-bar-row"><div class="name">${t.s}</div><div class="t1-bar-track"><div class="t1-bar-fill" style="width:${t.p}%;background:${hsl(t.p)}"></div></div><div class="pct">${t.p}%</div></div>`).join("")}
        <div class="t1-risk">${ROWS.map(r => `<div><b>${r.s}</b> - held by ${r.n} people in ${r.m}</div>`).join("")}</div>
      </div>`;
    }

    if (id === "test2") {
      el.innerHTML = `
        <div class="t2-topbar">SkillSight <b>::</b> Test 2 - Data Table &nbsp; | &nbsp; ${STATS.map(s=>`<b>${s.v}${s.suf}</b> ${s.l}`).join("  ")}</div>
        <div class="t2-wrap">
          <table class="t2"><thead><tr><th>Skill</th><th>Segment</th><th class="num">Coverage</th><th>Status</th></tr></thead>
          <tbody>${TILES.map(t => `<tr><td>${t.s}</td><td>${t.seg}</td><td class="num">${t.p}%</td><td><span class="t2-dot" style="background:${hsl(t.p)}"></span>${t.p<40?"Critical":t.p<70?"Watch":"Healthy"}</td></tr>`).join("")}
          ${ROWS.map(r => `<tr><td>${r.s}</td><td>${r.m}</td><td class="num">${r.n} ppl</td><td><span class="t2-dot" style="background:#c0392b"></span>Succession Risk</td></tr>`).join("")}</tbody></table>
        </div>`;
    }

    if (id === "test3") {
      const maxW = Math.max(...TILES.map(t => 100 - t.p));
      el.innerHTML = `<div class="t3-wrap">
        <div class="label">Test 3 - Treemap + Risk Cloud</div>
        <div class="t3-treemap">${TILES.map(t => `<div class="t3-block" style="flex:${(100-t.p)/maxW*10} 1 0%;background:${hsl(t.p)}">${t.s} ${t.p}%</div>`).join("")}</div>
        <div class="label" style="margin-top:0">Succession risk, sized by scarcity</div>
        <div class="t3-cloud">${ROWS.map(r => `<span style="font-size:${14+(6/r.n)*8}px">${r.s} (${r.n})</span>`).join("")}</div>
      </div>`;
    }

    if (id === "test4") {
      const maxBar = 200;
      const prose = `Of the ${STATS[4].v} plants and offices tracked, average coverage sits at <b>${STATS[0].v}%</b>. ` +
        ROWS.map(r => `<b>${r.s}</b> is held by just ${r.n} ${r.n===1?"person":"people"} in ${r.m}`).join("; ") + ".";
      el.innerHTML = `<div class="t4-wrap">
        <div class="label">Test 4 - Column Chart + Narrative</div>
        <div class="t4-chart">${TILES.map(t => `<div class="t4-col"><div class="val">${t.p}%</div><div class="bar" style="height:${t.p/100*maxBar}px;background:${hsl(t.p)}"></div></div>`).join("")}</div>
        <div class="t4-labels">${TILES.map(t => `<div>${t.s}</div>`).join("")}</div>
        <p class="t4-prose">${prose}</p>
      </div>`;
    }

    if (id === "test5") {
      const cols = [
        { name: "Critical (<40%)", color: "#c0392b", items: TILES.filter(t => t.p < 40) },
        { name: "Watch (40-69%)", color: "#d4a017", items: TILES.filter(t => t.p >= 40 && t.p < 70) },
        { name: "Healthy (70%+)", color: "#2f9e5b", items: TILES.filter(t => t.p >= 70) }
      ];
      el.innerHTML = `<div class="t5-wrap">
        <div class="label">Test 5 - Kanban Board</div>
        <div class="t5-board">${cols.map(c => `<div class="t5-col"><h3>${c.name}<span>${c.items.length}</span></h3>${c.items.map(t => `<div class="t5-card" style="border-left-color:${c.color}"><b>${t.s}</b><span>${t.seg} - ${t.p}%</span></div>`).join("")}</div>`).join("")}</div>
        <div style="margin-top:26px" class="label">Succession risk</div>
        ${ROWS.map(r => `<div style="font-size:13px;padding:6px 0;">${r.s} - ${r.n} people, ${r.m}</div>`).join("")}
      </div>`;
    }

    if (id === "test6") {
      el.innerHTML = `<div class="t6-wrap">
        <div class="label">Test 6 - Radial Gauges + Waffle Charts</div>
        <div class="t6-gauges">${STATS.map(s => {
          const pct = s.suf === "%" ? s.v : Math.min(s.v * 10, 100);
          return `<div class="t6-gauge">${ring(pct,90,9,"#7a1f2b","#e3e0ea")}<b>${s.v}${s.suf}</b><span>${s.l}</span></div>`;
        }).join("")}</div>
        <div class="label" style="margin-top:0">Skill coverage, one square = 10%</div>
        ${TILES.map(t => {
          const filled = Math.round(t.p / 10);
          const squares = Array.from({length: 10}, (_, i) => `<div style="${i < filled ? `background:${hsl(t.p)}` : ""}"></div>`).join("");
          return `<div class="t6-waffle-row"><div class="name">${t.s}</div><div class="t6-waffle">${squares}</div><div class="pct">${t.p}%</div></div>`;
        }).join("")}
      </div>`;
    }

    if (id === "test7") {
      const worst = [...TILES].sort((a,b) => a.p - b.p)[0];
      el.innerHTML = `
        <div class="t7-grid">
          <div class="t7-box t7-hero"><span>Test 7 - Bento + Bubbles</span><div><b>${STATS[0].v}%</b><br><span>Avg Coverage</span></div></div>
          <div class="t7-box t7-mid" style="background:${hsl(worst.p)}"><span>Biggest Gap</span><div><b>${worst.p}%</b><span>${worst.s}</span></div></div>
          <div class="t7-box t7-small" style="background:#111"><span>${STATS[2].l}</span><b>${STATS[2].v}</b></div>
          <div class="t7-box t7-small" style="background:#333"><span>${STATS[4].l}</span><b>${STATS[4].v}</b></div>
        </div>
        <div class="t7-bubbles">${TILES.map(t => {
          const d = 40 + (100 - t.p) * 0.9;
          return `<div class="t7-bubble" style="width:${d}px;height:${d}px;background:${hsl(t.p)}"><span><b>${t.p}%</b>${t.s.split(" ")[0]}</span></div>`;
        }).join("")}${ROWS.map(r => {
          const d = 40 + (10 / r.n) * 14;
          return `<div class="t7-bubble" style="width:${d}px;height:${d}px;background:#c0392b"><span><b>${r.n}</b>${r.s.split(" ")[0]}</span></div>`;
        }).join("")}</div>`;
    }
  }

  const names = ["Test 1","Test 2","Test 3","Test 4","Test 5","Test 6","Test 7"];
  const picker = document.getElementById("picker");
  const panels = document.getElementById("panels");
  names.forEach((name,i) => {
    const n = i+1, id = "test"+n;
    const btn = document.createElement("button");
    btn.textContent = name; btn.dataset.tab = id;
    if (n===1) btn.classList.add("active");
    btn.addEventListener("click", () => {
      document.querySelectorAll(".picker button").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".test-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(id).classList.add("active");
    });
    picker.appendChild(btn);
    const section = document.createElement("section");
    section.className = "test-panel"+(n===1?" active":"");
    section.id = id;
    panels.appendChild(section);
    build(id);
  });
</script>
</body>
</html>
