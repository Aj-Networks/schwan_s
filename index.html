<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSight - Workforce Skills Intelligence</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="appbar">
  <div class="brand"><span class="mark"></span>SkillSight</div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" class="search" type="search" placeholder="Search skills, job groups, or plants" autocomplete="off">
  </div>

  <div class="appbar-right">
    <span class="org">Schwan's Company</span>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch between light and dark">
      <svg class="ico-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M16 4l-1.4 1.4M5.4 14.6L4 16"/></g></svg>
      <svg class="ico-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9z" fill="currentColor"/></svg>
    </button>
    <div class="avatar">AA</div>
  </div>
</header>

<div class="shell">
  <aside class="listcol">
    <div class="list-head">
      <nav class="pinned" id="pinned"></nav>
      <div class="list-label">Skills <span id="skill-count"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="list-foot">Demo numbers. Plants, offices, and job groups are real.</div>
  </aside>

  <main class="detail" id="detail"></main>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
